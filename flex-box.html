<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flex-box</title>
    <style>
      .container div {
        font-size: 59px;
        border: 2px solid black;

        width: 200px;
      }
      .container {
        display: flex;
        margin-bottom: 10px;
        gap: 20px;
      }
      .box {
        font-size: 70px;
        height: 180px;
        width: 300px;
        border: 2px solid red;
      }
      .box-container {
        display: flex;
      }
      .card-container{
        display: flex;
        /* justify-content: center; */
        justify-content: space-around;
      }
      .card{
        border: 2px solid green;
        width: 150px;
        height: 150px;
        margin-top: 20px;
        color: red;
        background-color: pink;
        font-size: 2em;
        margin-bottom: 20px;
      }
      .user-container{
        display:flex ;
        flex-wrap: wrap;
        gap: 20px;
      }
      .user{
        border: 2px solid green;
        width: 150px;
        height: 150px;
        margin-top: 20px;
        color: red;
        background-color: pink;
        font-size: 2em;
        
      }
        
      
    </style>
    <link rel="stylesheet" href="navbar.css">
  </head>
  <body>
<header>
        <nav>
            <ul>
                <li><a href="auto.html">auto</a></li>
                <li><a href="center flex.html">center</a></li>
                <li><a href="flex-box.html">flex</a></li>
                <li><a href="form.html">form</a></li>
                <li><a href="index.html">index</a></li>
                <li><a href="nav-design.html">nav-design</a></li>
                <li><a href="auto-navbar.html">back-main</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
      <div>1</div>
      <div>2</div>
      <div>3</div>
      <div>5</div>
      <div>6</div>
    </div>

    <div class="box-container">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
    </div>

    <div class="card-container">
        <div class="card">card-1</div>
        <div class="card">card-2</div>
        <div class="card">card-3</div>
        <div class="card">card-4</div>
    </div>
    <div class="user-container">
        <div class="user">user-1</div>
        <div class="user">user-2</div>
        <div class="user">user-3</div>
        <div class="user">user-4</div>
        <div class="user">user-5</div>
        <div class="user">user-6</div>
        <div class="user">user-7</div>
        <div class="user">user-8</div>
        <div class="user">user-9</div>
        <div class="user">user-10</div>
        <div class="user">user-11</div>
        <div class="user">user-12</div>
    </div>
  </body>
</html>
