<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex-box</title>
    <style>
        .container div{
            font-size: 59px;
            border: 2px solid black;
          
            width: 200px;
        }
        .container{
            display: flex;
            margin-bottom: 10px;
        }
        .box{
            font-size: 70px;
            height: 180px;
            width: 300px;
            border: 2px solid red;
        }
        .box-container{
            display: flex;
        }
    </style>
</head>
<body>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>5</div>
        <div>6</div>
    </div>

    
    <div class="box-container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
    </div>
</body>
</html>
