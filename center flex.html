<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CENTER-FLEX</title>
    <style>
        .container{
            /* justify content center e anar jonno display flex kore nite hobe always,
             r eta mainly horijontal vabe kaj kore */
            display: flex;
            justify-content: center;
            background-color: violet;
            height: 600px;
            /* ebar vertical vabe center e anar jonno ager gulor sathe abar add korte hobe align items center  */
            align-items: center;
            /* align-items: stretch;
            stretch korte hole height bad dite hobe */
            
        }
        .box-container{

            height: 150px;
        }
    </style>
</head>
<body>
    <div class="container">

            box
        </div>
    </div>
</body>
</html>
